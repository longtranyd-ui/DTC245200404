name: dtc245200404-de28
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Can POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Can POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Can mat khau PostgreSQL}
      APP_DB_USER: ${APP_DB_USER:?Can APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Can mat khau ung dung}
      TZ: Asia/Bangkok
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    networks: [db_net]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  app:
    build: ./app
    image: dtc245200404-de28-app:local
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Can khoa phien}
      TZ: Asia/Bangkok
    networks: [web_net, db_net]
    user: '10001:10001'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    ports: ['127.0.0.1:8088:8080']
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web_net]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    ports: ['127.0.0.1:8089:5050']
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Can mat khau pgAdmin}
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_SERVER_MODE: 'True'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks: [admin_net, db_net]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus', '--storage.tsdb.retention.time=7d']
    ports: ['127.0.0.1:9091:9090']
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [monitor_net]
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports: ['127.0.0.1:3001:3000']
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Can tai khoan Grafana}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Can mat khau Grafana}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitor_net]
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    restart: unless-stopped
    privileged: true
    command: ['--docker_only=true', '--housekeeping_interval=15s']
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [monitor_net]
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    restart: unless-stopped
    command: ['--nginx.scrape-uri=http://nginx:8081/stub_status']
    networks: [web_net, monitor_net]
    depends_on:
      nginx: {condition: service_healthy}
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: 'db:5432/${POSTGRES_DB}?sslmode=disable'
      DATA_SOURCE_USER: ${MONITOR_DB_USER:?Can tai khoan giam sat DB}
      DATA_SOURCE_PASS: ${MONITOR_DB_PASSWORD:?Can mat khau giam sat DB}
    networks: [db_net, monitor_net]
    depends_on:
      db: {condition: service_healthy}
networks:
  web_net: {}
  admin_net: {}
  db_net: {internal: true}
  monitor_net: {}
volumes:
  postgres-data: {}
  pgadmin-data: {}
  prometheus-data: {}
  grafana-data: {}
